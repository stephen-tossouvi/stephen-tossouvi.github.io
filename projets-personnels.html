<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="site.js" defer></script>
    <title>Projet personnels - Stephen TOSSOUVI</title>
</head>
<body>
    <div class="site-controls" aria-label="Options d'affichage">
      <button class="site-control" type="button" data-theme-toggle aria-label="Activer le thème clair" title="Activer le thème clair" aria-pressed="false">
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
      <button class="site-control" type="button" data-back-to-top aria-label="Retour en haut" title="Retour en haut" hidden>
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
      </button>
    </div>
    <section id="projets">
  <h2>Projets personnels</h2>

  <div class="accordion-item">
    <button class="accordion-header" onclick="toggleProject(this)">
      Site de services à domicile
      <i class="fa-solid fa-chevron-down"></i>
    </button>
    <div class="accordion-content">
      <p>Plateforme de mise en relation entre demandeurs et prestataires, avec recherche par proximité, réservation et profils.</p>
      <span class="tag">Figma · HTML · CSS · JS</span>
    </div>
  </div>

  <a href="index.html#projets" class="btn btn-outline" style="margin-top:20px;display:inline-block;">← Retour aux projets</a>
</section>

<script>
  function toggleProject(button) {
    const content = button.nextElementSibling;
    const isOpen = content.style.maxHeight;
    content.style.maxHeight = isOpen ? null : content.scrollHeight + "px";
    button.classList.toggle("active");
  }
</script>
</body>
</html>
